# =============================================================================
#  Mosquitto broker -- runs on the personal computer, as the brief requires.
#  Embedded Systems final project -- Mahan Majlesi (402170516)
#
#  Security requirement 2 of the brief: "MQTT anonymous access must be disabled
#  and a dedicated user with a password must be created."  Both are enforced
#  below, and an ACL confines that user to this project's own topic tree so a
#  leaked board credential cannot read or write anything else on the broker.
#
#  Start with:
#      /opt/homebrew/opt/mosquitto/sbin/mosquitto -c <this file> -v
# =============================================================================

# ------------------------------------------------------------------ listener
# Bound to all interfaces so the board on 192.168.100.26 can reach it.
listener 1883 0.0.0.0
protocol mqtt

# --------------------------------------------------------- authentication
# No anonymous clients. Experiment 3-6 connects without credentials and is
# expected to be refused with "Connection Refused: not authorised".
allow_anonymous false

# Created with:  mosquitto_passwd -c passwd guardian
password_file /opt/homebrew/etc/mosquitto/guardian.passwd

# --------------------------------------------------------------------- ACL
acl_file /opt/homebrew/etc/mosquitto/guardian.acl

# ------------------------------------------------------------------ limits
max_connections 50
max_keepalive 120
# Retained messages matter here: the Last Will on status/402170516/home is
# retained so a subscriber that connects after the board died still sees it.
retain_available true
max_queued_messages 200
message_size_limit 262144

# ------------------------------------------------------------------ logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---------------------------------------------------------------- persistence
persistence true
persistence_location /opt/homebrew/var/lib/mosquitto/
autosave_interval 60
