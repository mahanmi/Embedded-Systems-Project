# =============================================================================
#  Smart Guardian System -- board configuration
#  Embedded Systems final project -- Mahan Majlesi (402170516)
#
#  Non-secret settings only. Credentials live in /etc/guardian/secrets.env,
#  which systemd injects into the environment; the daemon refuses to start if
#  any of them is missing rather than falling back to a compiled-in value.
#  Putting a password-shaped key in this file is a hard startup error.
# =============================================================================

# ------------------------------------------------------------------ identity
# Used in the page title, the TLS certificate CN, the MQTT topic tree and the
# overlay burned into every processed frame.
student_id   = 402170516
student_name = Mahan Majlesi

# ----------------------------------------------------------------- web server
http_port     = 80        # plaintext; answers everything with 301 -> https
https_port    = 443       # TLS
loopback_port = 8081      # 127.0.0.1 only, for the FastAPI Swagger gateway
tls_cert      = /etc/guardian/certs/guardian.crt
tls_key       = /etc/guardian/certs/guardian.key

# Only the fallback for the 301 redirect, and it is rarely reached: the
# redirect prefers the Host header the client actually used, so reaching the
# board by DDNS name already redirects to that same name with no change here.
# It matters when a request arrives with no Host header at all.
#
# When the board moves off this LAN, set this to the name it answers to from
# outside -- and remember the certificate has to carry that name too:
#     sudo HOST_IP=<new lan ip> PUBLIC_NAME=<ddns name> /opt/guardian/bin/gen_cert.sh
# Builds the 301 Location header and the Swagger URL, so a stale value here
# redirects browsers to an address that no longer answers. A Bonjour name rather
# than a literal IP for the same reason mqtt_host is one: this board is a DHCP
# client and its address moves (.26 -> .33 on 2026-08-02).
#
# It also matches the certificate without regenerating it -- the SAN list from
# gen_cert.sh already carries DNS:mahan and DNS:mahan.local, so browsing the
# dashboard by name validates where browsing it by IP now would not.
#
# LAN only: mDNS does not cross subnets, so this becomes the DDNS name once the
# dashboard is reached over the internet. gen_cert.sh has PUBLIC_NAME for
# putting that name in the SAN list.
public_host   = mahan.local

# ------------------------------------------------------------------------ MQTT
# The broker runs on the personal computer, as the brief requires.
#
# Addressed by its Bonjour name rather than a literal IP: the laptop takes its
# address from DHCP, so a hardcoded one goes stale the moment it rejoins the
# network (that is exactly what happened -- .17 became .27 and every publish
# failed until the fallback took over). libnss-mdns is installed on the board
# and avahi-daemon resolves this for the guardian user, so the name tracks the
# laptop wherever it lands on this LAN.
mqtt_host               = Mahans-MacBook-Pro.local
# Tried when the primary is unreachable: an SSH port-forward from the laptop
# presents the same broker on this board's loopback. See mac/mqtt_tunnel.sh.
mqtt_host_fallback      = 127.0.0.1
mqtt_port               = 1883
mqtt_user               = guardian
mqtt_keepalive          = 20
mqtt_telemetry_interval = 5

# ------------------------------------------------------------------------ mail
smtp_url                = smtps://smtp.gmail.com:465
smtp_user               = you@example.com
mail_from               = you@example.com
mail_to                 = you@example.com
# The brief: at most one detection email every 30 seconds.
mail_debounce_sec       = 30
# Guard mode trades the batching window for an anti-flood floor.
mail_guard_debounce_sec = 3

# -------------------------------------------------------------------- telegram
# A second alert channel that runs alongside the mail one, not instead of it:
# the same four events (detection, guard alarm, watchdog, thermal) are pushed
# to a bot, with the detection frame sent as a real photo rather than an
# attachment. It has its own worker thread, so a stalled proxy connection can
# never hold up an email.
#
# Setting telegram_enabled = false, or leaving GUARDIAN_TELEGRAM_TOKEN unset in
# secrets.env, disables the channel and the daemon logs why and carries on.
telegram_enabled            = true
telegram_chat_id            = 000000000
telegram_api_base           = https://api.telegram.org
# api.telegram.org is not reachable directly from this network. socks5h --
# rather than socks5 -- resolves the hostname AT the proxy, which matters here
# because the local resolver is part of what is being filtered.
#
# There are deliberately no credentials in this URL. The proxy username is the
# separate key below and the password is GUARDIAN_TELEGRAM_PROXY_PASS in
# secrets.env, because a URL carrying a password is itself a credential and
# would then belong nowhere near this file. scripts/check_secrets.sh greps for
# exactly that mistake.
#
# Leave telegram_proxy_url empty to connect directly.
telegram_proxy_url          = socks5h://proxy.example.invalid:1080
telegram_proxy_user         = 1
# Seeded to the mail intervals so both channels behave identically today. They
# are separate keys so Telegram can be made more responsive later without
# touching the brief's "at most one email every 30 seconds".
telegram_debounce_sec       = 30
telegram_guard_debounce_sec = 3

# The bot also LISTENS. A second thread long-polls getUpdates and answers a
# small command set -- /preview returns a photo of the current frame, /help
# lists the commands, /start explains what the bot is.
#
# Long polling rather than a webhook is forced, not chosen: a webhook needs
# Telegram to open a connection INTO the board, and the only route this network
# has to the API is the outbound proxy above.
#
# Every command is READ-ONLY. Arming the alarm, changing the frame rate and
# rebooting stay behind the REST API's bearer token, because a chat is
# authenticated by whoever is holding the phone. A command is honoured only
# when the sender's chat id matches telegram_chat_id above; anyone else is
# refused before a frame is even read.
#
# Set this to false to shut off the inbound surface entirely while keeping the
# alerts.
telegram_commands_enabled   = true
# Minimum gap between two /preview replies. Long enough that a held-down button
# cannot make a 600 MHz board encode and upload back to back, short enough that
# the command still feels live. Requests inside the window get a "try again in
# N s" line rather than silence.
telegram_preview_cooldown_sec = 10

# ------------------------------------------------------- black box (part 4-2)
db_path      = /var/lib/guardian/guardian.db
db_ring_size = 1000

# ------------------------------------------------------------ camera source
# socket -- a capture host (the laptop) pushes MJPEG at guardian-ingest.socket.
#           This is the brief's documented fallback for a board with no camera.
# rtsp   -- the board pulls H.264 straight from a camera or DVR on the LAN, so
#           no laptop is involved at all.
# DEPLOYED VALUE DIFFERS, DELIBERATELY (2026-08-02). This file says `rtsp` --
# the target state for this branch -- while /etc/guardian/guardian.conf on the
# board is `socket` and is what actually runs. Recorded here rather than left to
# be rediscovered: the two have silently disagreed before, and reading this copy
# to diagnose a live fault then gives the wrong answer. Check the board with
#
#     ssh mahan@mahan.local 'sudo grep ^camera_source /etc/guardian/guardian.conf'
#
# before reasoning about the data path. The board stays on `socket` until the
# undervoltage is fixed, because the measurement that ruled `rtsp` too expensive
# (57% of one core) was itself taken at 600 MHz -- see the note in
# mac/stream_dvr.sh. Re-decide once the board holds 1.4 GHz.
camera_source    = rtsp

# Hikvision DS-7204HUHI-K1/P DVR.
#
# TWO-SITE OPERATION
# ------------------
# The DVR stays at the house; the board does not. Once the board is at the
# other site this has to become the house's public name and the RTSP hop
# crosses the internet:
#
#     camera_host      = <home ddns name>      # NOT the raw public IP
#     camera_rtsp_port = 554                   # already forwarded -> .64
#
# A hostname works here with no code change -- guardian_vision.py interpolates
# it straight into the URL and FFmpeg resolves it. Because _open() rebuilds the
# VideoCapture on every reconnect, a DDNS address change is picked up on the
# next retry on its own; there is no cache to flush.
#
# Use a DDNS name rather than the literal address. A residential IP rotates,
# and the day it does, a hardcoded one takes the camera down until someone
# notices and edits this line.
#
# Two settings below stop being stylistic choices once this is a WAN hop and
# become load-bearing -- see the notes on camera_channel and camera_transport.
# Reached through the house's port forward, not on this LAN: the DVR stayed put
# when the board moved (2026-08-02). Only consulted in `rtsp` mode -- in
# `socket` mode the laptop makes this hop and takes the address from
# CAMERA_HOST in mac/stream_dvr.sh instead.
#
# Residential WAN addresses rotate. When the stream dies for no other apparent
# reason, verify this address before anything else, and move to a DDNS name
# once one exists.
camera_host      = dvr.example.invalid
camera_rtsp_port = 554
camera_user      = admin

# Channel id, NOT a channel number: <camera><stream>, where stream 1 is the
# main stream and 2 the sub-stream.
#   202 = camera 2 "KOOCHE" (alley), sub-stream   <- in use
#   102 = camera 1 "HAYAT"  (yard),  sub-stream
#
# Always a sub-stream. The main streams on this DVR are H.265 at up to 2560x1440
# and the Pi 3B+ has no H.265 hardware decoder, so decoding one in software is
# not viable. The sub-streams are H.264 960x576 @12 fps, measured at 49% of one
# core -- affordable alongside detection.
#
# That 49% is PROVISIONAL (2026-08-02): measured at 600 MHz under undervoltage,
# so it is 49% of a core running at 43% of its rated speed. Expect roughly half
# that once the supply is replaced. See the note on cv_threads below.
#
# Across the internet the sub-stream is also the only one the uplink can carry.
# Measure the real bitrate and the house's upload before moving the board --
# sustained upload wants to be about 2x the stream, and if it is not, lower the
# sub-stream bitrate in the DVR's own web UI rather than fighting it here.
camera_channel   = 202

# TCP rather than UDP: UDP loses slices on a busy network and the resulting
# artefacts look exactly like a failing camera.
#
# Over the internet this is no longer a preference. UDP puts RTP on separate
# return ports negotiated in the SDP, and those do not survive NAT at either
# end -- the stream would simply never arrive. TCP keeps everything interleaved
# on the one connection that the port forward already covers.
camera_transport = tcp

# The camera password is NOT here. It lives in /etc/guardian/secrets.env as
# GUARDIAN_CAM_PASS, which is root:guardian 0640 and injected by systemd.

# ---------------------------------------------------------------- vision
# Matches stream_webcam.sh's wire rate (FPS=15) so the board is not
# self-throttling below what the capture host already sends. The thermal
# governor (part 4-4) steps this down on its own if it turns out unsustainable.
target_fps   = 15
# Capture resolution handed to the detector.
target_width = 640
# OpenCV DNN worker threads. 4 benchmarks fastest in isolation (1088 ms vs
# 1551 ms at 300 px) but was worse in practice: the extra sustained load crossed
# the thermal governor's setpoint, which then cut the stream to 2 fps at 320 px.
# See the long note in vision/guardian_vision.py. Re-measure before raising it,
# and judge it on sustained temperature rather than on inference latency.
#
# PROVISIONAL -- this choice is not currently trustworthy (2026-08-02). Both the
# latency figures and the thermal behaviour they were weighed against were
# measured while the board ran at 600 MHz instead of 1400 MHz, clamped by
# undervoltage. At full clock the board makes more heat per second but finishes
# each inference in well under half the time, so the load/temperature trade-off
# that made 4 lose is not the one that will apply.
#
# Today's re-measurement cannot settle it either: 4 threads gave a 1064 ms
# median against 1235 ms for 2, but with min 849 / max 1080 -- that spread is
# the supply rail oscillating across the undervoltage threshold, not a thread
# effect. Re-decide after the power supply is replaced, on sustained
# temperature over hours rather than on a latency median.
cv_threads = 2

# Detection region of interest. MobileNet-SSD takes a square input, so feeding
# it a 16:9 frame stretches people horizontally by 1.78x and it stops
# recognising them: measured 0/12 detections on real footage whole-frame versus
# 12/12 (mean confidence 0.806) on a square crop. See the long note in
# vision/guardian_vision.py.
#
# "auto" = the largest undistorted square, aligned by detect_roi_align. For this
# camera "right" is correct: the left 44% of the view is our own wall and roof.
# Override with explicit "x,y,w,h" in capture-frame pixels for another framing.
detect_roi       = auto
detect_roi_align = right

# Detector network input edge. 300 is MobileNet-SSD's native size and the
# most accurate; smaller values trade accuracy for speed (experiment 3-3).
target_net_input = 300

# --------------------------------------------------------------- vehicles
# The alley almost always has a parked car. MobileNet-SSD is a VOC model and
# already emits car/bus/motorbike from the same forward pass, so counting them
# costs nothing extra -- they were simply being discarded.
#
# Vehicles are counted and drawn ONLY. They never reach the mailer, the guard
# alarm or the black box: a parked car is permanent, so wiring it into the alert
# path would email every 30 s forever and hold guard mode permanently triggered.
detect_vehicles = true

# Much lower than the 0.45 used for people, and measured rather than guessed.
# With the same ROI crop on this camera:
#     alley with cars parked   0.27-0.37   (92 frames; only 2 reached 0.45)
#     yard with no vehicles    0.000       (15 frames, exactly zero)
# The noise floor for these classes is zero, so 0.25 has room on both sides.
vehicle_conf_threshold = 0.25

# Vehicles score barely above their threshold, so a stationary car crosses it
# back and forth and the raw count blinks. Hold the last sighting this many
# inferences before dropping it. People do not get this -- it would delay the
# count the brief grades and experiment 3-5 measures.
#
# 8, not 3, and measured: with one parked car in view over 20 samples,
#     hold = 3   counted in 13/20, dropped to zero in 7
#     hold = 8   counted in 19/20, dropped to zero in 1
# A parked car is a persistent object, so holding it is the honest reading. The
# cost is that a departing car keeps being counted for up to 8 inferences --
# though driving away is motion, which makes the gate fire far more often and
# expires the hold in seconds rather than the ~24 s a static scene would take.
vehicle_hold_frames = 8

# ------------------------------------------------------ watchdog (part 4-3)
watchdog_stale_sec = 30

# ---------------------------------------- adaptive thermal mgmt (part 4-4)
#
# Raised from 70/65. At 70 the governor tripped constantly once the board began
# decoding H.264 from the DVR: 24 throttle events in six hours, cycling between
# full rate and 2 fps every half hour. That is the governor working correctly on
# a setpoint set too tight, not a fault -- but it made the dashboard feel broken.
#
# 75 is still a real margin: the Pi's own hardware throttle is at 80 C and its
# soft limit at 60 C only affects turbo, so 75 leaves 5 C of headroom before the
# SoC would step in on its own. The 7 C gap to the low mark keeps the hysteresis
# that stops the level from flapping (see the note in events.c).
#
# PROVISIONAL (2026-08-02). Both setpoints were chosen against a board running
# at 600 MHz, clamped by undervoltage -- which is a much cooler board than the
# one this is meant to govern. It idled at 52 C and reached only 58-61 C with
# all four cores pinned, so the 75 C setpoint was barely being exercised and the
# "24 throttle events in six hours" that motivated raising it from 70 happened
# at 43% of rated clock. At 1.4 GHz the thermal picture is genuinely different.
# Re-run experiment 4-4 and re-tune both marks once the supply is replaced.
thermal_high_c = 75.0
thermal_low_c  = 68.0

# ------------------------------------------------------ guard mode (part 4-1)
guard_default = false

# Contrast-equalise the detector's input (CLAHE). Night IR is much flatter than
# the daylight photographs MobileNet-SSD was trained on, and the model misreads
# low-contrast shapes: the parked pickup came back as "chair 0.59". Measured
# over 89 live night frames, vehicles found per frame went 0.00 -> 1.01, and the
# parked car's confidence went 0.27-0.72 -> 0.82-0.95. Neutral for people
# (12/12 detected either way) and costs no measurable time, since it runs on the
# 300x300 network input rather than the full frame.
enhance_contrast = true

# CLAHE coefficients, tuned against 271 frames of a person walking this alley.
# Frames were labelled by background subtraction, not by the detector, so the
# model was not grading its own homework: 59 with motion, 81 clean.
#
#   config            mean   detected@0.45   false positives
#   no enhancement    0.016        3%             0.0%
#   clip=3 tile=8     0.596       64%             1.2%
#   clip=5 tile=4     0.693       81%             0.0%   <- chosen
#   clip=8 tile=4     0.713       86%            12.3%
#
# tile=4 beats 8 and 16: the IR illuminator washes this scene out fairly evenly,
# so a few large tiles equalise it better than many small ones, which mostly
# amplify local noise. clip=8 looked best on a 30-frame sample (3% false
# positives) but was 12.3% across all 81 clean frames -- five points of recall
# for ten times the false alarms, and this system emails on detection.
clahe_clip_limit = 5.0
clahe_tile_grid  = 4
